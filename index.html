<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Discovery: The Seamless Voyage (Final)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Google+Sans:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box !important; }
    
    :root {
      --surface: #FFFFFF;
      --surface-bright: #F5F5F5;
      --surface-dim: #FFFFFF;
      --on-surface: #000000;
      --accent: #4fa0ff;
      --accent-glow: rgba(79, 160, 255, 0.3);
      --screen-width: 402px; 
      --bezel-width: 8px;
      --phone-width: 418px; 
      --phone-height: 932px;
      --border-radius: 54px;
    }

    body {
      background-color: #F0F0F0;
      color: #000;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .phone-container {
      width: var(--phone-width);
      height: var(--phone-height);
      background-color: #000;
      border: var(--bezel-width) solid #3a3a3a;
      border-radius: var(--border-radius);
      position: relative;
      box-shadow: 0 50px 100px rgba(0,0,0,0.2), inset 0 0 0 1px rgba(255,255,255,0.1), 0 0 40px rgba(0, 0, 0, 0.05);
      overflow: visible;
      transform: scale(0.9);
      background: linear-gradient(135deg, #111, #000);
    }

    .btn-side { position: absolute; background: #2a2a2a; border-radius: 2px; z-index: -1; border: 1px solid rgba(255,255,255,0.05); }
    .btn-action { left: -11px; top: 160px; width: 3px; height: 32px; }
    .btn-vol-up { left: -11px; top: 210px; width: 3px; height: 64px; }
    .btn-vol-down { left: -11px; top: 290px; width: 3px; height: 64px; }
    .btn-power { right: -11px; top: 210px; width: 3px; height: 96px; }
    .btn-camera { right: -11px; top: 580px; width: 3px; height: 72px; background: #222; }

    .phone-notch {
      position: absolute;
      top: 13px;
      left: 50%;
      transform: translateX(-50%);
      width: 112px;
      height: 33px;
      background-color: #000;
      border-radius: 22px;
      z-index: 100;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
    }
    .notch-lens { width: 12px; height: 12px; background: radial-gradient(circle at center, #1a1a2a 0%, #000 70%); border-radius: 50%; box-shadow: inset 0 0 2px rgba(79, 160, 255, 0.2); }

    .phone-screen {
      width: var(--screen-width);
      height: 100%;
      background-color: #FFF;
      position: relative;
      overflow: hidden;
      border-radius: calc(var(--border-radius) - 12px);
    }

    .layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.6s ease;
      pointer-events: none;
      opacity: 0;
      filter: blur(20px);
      transform-origin: 0 0;
    }
    .layer.active { opacity: 1; pointer-events: auto; filter: blur(0); }

    #canvas-container { background-color: #FFFFFF; cursor: grab; z-index: 10; transform-origin: 0 0; will-change: transform; }
    #canvas-container:active { cursor: grabbing; }

    #grid-background {
      position: absolute;
      width: 20000px;
      height: 20000px;
      background-image: radial-gradient(rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 60px 60px;
      transform-origin: 0 0;
      opacity: 0.3;
      will-change: transform;
    }
    #l1-cards-layer { transform-origin: 0 0; position: absolute; will-change: transform; }

    #detail-page { background-color: #FFF; z-index: 20; overflow-y: auto; overflow-x: hidden; padding: 100px 0 120px; }
    #detail-page::-webkit-scrollbar { width: 0; }
    #product-detail-page { background-color: #FFF; z-index: 30; overflow-x: auto; scroll-snap-type: x mandatory; }
    #product-detail-page::-webkit-scrollbar { width: 0; }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 54px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 42px;
      font-size: 17px;
      font-weight: 700;
      z-index: 110;
      color: #000;
      letter-spacing: -0.01em;
    }
    .status-icons { display: flex; align-items: center; gap: 8px; }
    .status-icons svg path, .status-icons svg rect { fill: #000 !important; stroke: #000 !important; }
    .status-icons svg rect[opacity="0.35"] { stroke: #000 !important; opacity: 0.2 !important; }
    .status-icons svg path[opacity="0.4"] { fill: #000 !important; opacity: 0.2 !important; }

    #chat-bar-container {
      position: absolute;
      bottom: 56px;
      left: 50%;
      transform: translateX(-50%);
      width: 290px;
      height: 80px;
      z-index: 120;
    }
    #chat-bar-glow {
      position: absolute;
      inset: 0;
      border-radius: 40px;
      border: 6px solid #A2D4FF;
      filter: blur(16px);
      background: rgba(162, 212, 255, 0.05);
      pointer-events: none;
    }
    #chat-bar {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 40px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      padding: 0;
    }
    #chat-bar-label {
      position: absolute;
      left: 68px;
      color: #000;
      font-family: sans-serif;
      font-size: 20px;
      font-weight: 300;
      line-height: 24px;
      pointer-events: none;
    }
    #chat-bar input {
      background: transparent;
      border: none;
      color: #000;
      outline: none;
      width: 100%;
      height: 48px;
      padding-left: 68px;
      padding-right: 100px;
      font-family: sans-serif;
      font-size: 20px;
      font-weight: 300;
    }
    #search-icons-group { position: absolute; right: 0; top: 0; height: 100%; display: flex; align-items: center; }
    #search-trigger { position: absolute; right: 13px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    #search-trigger svg circle { stroke: #000 !important; }
    #mic-icon { position: absolute; right: 66px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    #mic-icon svg rect, #mic-icon svg path { stroke: #000 !important; }
    #chat-plus-icon { position: absolute; left: 31px; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
    #chat-plus-icon svg path { stroke: #000 !important; }

    #mix-btn {
      position: absolute;
      bottom: 156px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #000;
      color: #FFF;
      font-weight: 800;
      padding: 12px 32px;
      border-radius: 20px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      z-index: 121;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #mix-btn.visible { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }

    .product-card-l1 {
      position: absolute;
      background: #F5F5F5;
      transition: opacity 0.3s ease, border-color 0.3s ease, box-shadow 0.2s ease;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    #toolbar-header {
      position: absolute;
      left: 16px;
      top: 62px;
      display: flex;
      align-items: center;
      z-index: 900;
    }

    #apple-toolbar-circle {
      width: 44px;
      height: 44px;
      background: rgba(253, 252, 252, 0.4);
      backdrop-filter: blur(20px);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      cursor: pointer;
    }

    .menu-icon-svg {
      width: 18px;
      height: 8px;
    }

    .gemini-title {
      margin-left: 12px;
      color: #000;
      font-family: 'Google Sans', sans-serif;
      font-size: 17px;
      font-weight: 400;
      line-height: 24px;
    }

    .gemini-version {
      margin-left: 4px;
      color: rgba(0, 0, 0, 0.55);
      font-family: 'Google Sans', sans-serif;
      font-size: 17px;
      font-weight: 400;
      line-height: 24px;
    }

    .chevron-down {
      margin-left: 4px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #right-toolbar-box {
      position: absolute;
      right: 16px;
      top: 62px;
      width: 88px;
      height: 44px;
      background: rgba(253, 252, 252, 0.4);
      backdrop-filter: blur(20px);
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      cursor: pointer;
    }

    #right-box-svg {
      margin-left: -4px;
    }

    #right-box-dots {
      margin-left: 12px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .luminous-dot {
      width: 4px;
      height: 4px;
      background-color: #000;
      border-radius: 50%;
      opacity: 0.8;
    }

    #loading-layer {
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 850;
    }

    @keyframes logo-pulse {
      0% { transform: scale(1); opacity: 1; filter: blur(0px); }
      50% { transform: scale(1.1); opacity: 0.7; filter: blur(2px); }
      100% { transform: scale(1); opacity: 1; filter: blur(0px); }
    }

    .pulse-animation {
      animation: logo-pulse 1.5s ease-in-out infinite;
    }

    .expand-btn {
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #000;
      z-index: 130;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      cursor: pointer;
    }
    .expand-btn.visible { opacity: 1; pointer-events: auto; }
    #expand-bottom { bottom: 150px; left: 50%; transform: translateX(-50%) translateY(10px); }
    
    #expand-bottom.visible { transform: translateX(-50%) translateY(0); }
  </style>
</head>

      <div id="canvas-container" class="layer"><div id="grid-background"></div><div id="l1-cards-layer"></div></div>
      <div id="detail-page" class="layer"><div id="l2-grid"></div></div>
      <div id="product-detail-page" class="layer"><div id="pdp-carousel-wrap" class="flex h-full"></div></div>
      <button id="mix-btn">Mix</button>
      <button id="expand-bottom" class="expand-btn">Expand ↓</button>
      <div id="chat-bar-container">
        <div id="chat-bar-glow"></div>
        <div id="chat-bar">
          <div id="chat-plus-icon" class="cursor-pointer hover:scale-110 transition-transform"><svg viewBox="0 0 18 18"><path d="M9 0V18M0 9H18" stroke="white" stroke-width="2"/></svg></div>
          <div id="chat-bar-label">Ask Gemini</div>
          <input type="text" id="search-input">
          <div id="search-icons-group">
            <div id="mic-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="8.16699" y="2.33344" width="7" height="12.8333" rx="3.5" stroke="white" stroke-width="1.16667"/><path d="M11.667 18.6667C11.667 19.2487 11.667 20.2211 11.667 20.9976" stroke="white" stroke-width="1.16667" stroke-linecap="round"/><path d="M18.667 11.6667C18.667 15.5327 15.533 18.6667 11.667 18.6667C7.801 18.6667 4.66699 15.5327 4.66699 11.6667" stroke="white" stroke-width="1.16667" stroke-linecap="round"/></svg></div>
            <div id="search-trigger"><svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="9.4" stroke="white" stroke-width="1.2"/></svg></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = { products: [], selectedIds: [], zoom: 0.3, panX: 0, panY: 0, isPanning: false, isTransitioning: false, activeLayer: 'L0', reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches, gridCols: 30, gridRows: 50 };
    const searchInput = document.getElementById('search-input'), searchBtn = document.getElementById('search-trigger'), l0Layer = document.getElementById('l0-layer'), loadingLayer = document.getElementById('loading-layer'), l1Layer = document.getElementById('canvas-container'), l1Cards = document.getElementById('l1-cards-layer'), gridBg = document.getElementById('grid-background'), l2Layer = document.getElementById('detail-page'), l2Grid = document.getElementById('l2-grid'), l3Layer = document.getElementById('product-detail-page'), l3Carousel = document.getElementById('pdp-carousel-wrap'), mixBtn = document.getElementById('mix-btn'), chatLabel = document.getElementById('chat-bar-label'), plusBtn = document.getElementById('chat-plus-icon'), announcer = document.getElementById('announcer');
    const expandBottom = document.getElementById('expand-bottom');

    searchInput.addEventListener('input', () => { if (searchInput.value.length > 0) chatLabel.style.display = 'none'; else chatLabel.style.display = 'block'; });
    searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchBtn.click(); });

    plusBtn.onclick = () => {
      if (state.activeLayer === 'L0') return;
      if (state.isTransitioning) return; state.isTransitioning = true;
      searchInput.value = '';
      chatLabel.style.display = 'block';
      l0Layer.classList.add('active');
      l1Layer.classList.remove('active');
      l2Layer.classList.remove('active');
      l3Layer.classList.remove('active');
      loadingLayer.classList.remove('active');
      l1Layer.style.opacity = '0';
      state.activeLayer = 'L0';
      announcer.textContent = 'Returned to entrance.';
      setTimeout(() => { state.isTransitioning = false; }, 800);
    };

    expandBottom.onclick = () => expandGrid('bottom');

    function expandGrid(direction) {
      if (state.isTransitioning || state.products.length === 0) return;
      state.isTransitioning = true;
      announcer.textContent = 'Expanding grid ' + direction + '...';

      // Identify an anchor product to maintain visual focus
      const anchorProduct = state.products[0];
      const anchorOldX = anchorProduct.x;
      const anchorOldY = anchorProduct.y;
      const oldScreenX = (anchorOldX * state.zoom) + state.panX;
      const oldScreenY = (anchorOldY * state.zoom) + state.panY;

      const newProducts = generateProducts(searchInput.value || 'Discovery', 100);

      if (direction === 'bottom') {
        state.products = state.products.concat(newProducts);
        state.gridRows += 10;
      }

      renderL1(); 

      state.panX = oldScreenX - (anchorProduct.x * state.zoom);
      state.panY = oldScreenY - (anchorProduct.y * state.zoom);

      updateTransform();
      setTimeout(() => { state.isTransitioning = false; updateTransform(); }, 400);
    }

    function generateProducts(query, count = 400) {
      const normalizedQuery = query.toLowerCase().trim(), items = [];
      for (let i = 0; i < count; i++) items.push({ id: i, name: `Premium ${query} ${i + 1}`, price: Math.floor(Math.random() * 800) + 120, rating: (Math.random() * 1.5 + 3.5).toFixed(1), img: `https://picsum.photos/seed/${i + normalizedQuery}/1200/1200`, x: 0, y: 0, w: 0, h: 0 });
      return items;
    }

    function renderL1() {
      l1Cards.innerHTML = ''; const baseSize = 220, gap = 24;
      const columns = state.gridCols, rows = state.gridRows; 
      let maxX = 0, maxY = 0;
      const grid = Array(rows).fill().map(() => Array(columns).fill(false));
      state.products.forEach((p, i) => {
        const findSpot = (prefType) => {
          let wm = 1, hm = 1; if (prefType === '2x2') { wm = 2; hm = 2; } else if (prefType === '2x1') { wm = 2; hm = 1; } else if (prefType === '1x2') { wm = 1; hm = 2; }
          for (let r = 0; r <= rows - hm; r++) for (let c = 0; c <= columns - wm; c++) {
            let clear = true; for (let dr = 0; dr < hm; dr++) for (let dc = 0; dc < wm; dc++) if (grid[r+dr][c+dc]) clear = false;
            if (clear) return { r, c, wm, hm };
          }
          return null;
        };
        let spot = findSpot(i % 15 === 0 ? '2x2' : (i % 8 === 0 ? '2x1' : (i % 6 === 0 ? '1x2' : '1x1'))) || findSpot('1x1');
        if (!spot) return;
        for (let dr = 0; dr < spot.hm; dr++) for (let dc = 0; dc < spot.wm; dc++) grid[spot.r+dr][spot.c+dc] = true;
        p.x = spot.c * (baseSize + gap); p.y = spot.r * (baseSize + gap); p.w = (baseSize * spot.wm) + (gap * (spot.wm - 1)); p.h = (baseSize * spot.hm) + (gap * (spot.hm - 1));
        
        maxX = Math.max(maxX, p.x + p.w);
        maxY = Math.max(maxY, p.y + p.h);

        const card = document.createElement('div'); card.className = 'product-card-l1 border border-black/5 rounded-[40px] overflow-hidden shadow-2xl hover:z-50 cursor-pointer'; card.style.cssText = `width:${p.w}px; height:${p.h}px; left:${p.x}px; top:${p.y}px;`;
        card.innerHTML = `<img src="${p.img}" class="w-full h-full object-cover transition-all duration-700">`;
        let pressTimer;
        const startPress = () => { if (state.activeLayer !== 'L1') return; card.style.transitionDuration = '1000ms'; card.style.boxShadow = '0 0 0 8px var(--accent), 0 0 30px var(--accent-glow)'; card.style.borderColor = 'var(--accent)'; pressTimer = setTimeout(() => { triggerSimilarityWave(p); card.style.transitionDuration = '200ms'; if (!state.selectedIds.includes(p.id)) { card.style.boxShadow = 'none'; card.style.borderColor = 'rgba(0,0,0,0.05)'; } else { card.style.boxShadow = '0 0 0 2px var(--accent), 0 0 20px var(--accent-glow)'; } }, 1000); };
        const cancelPress = () => { clearTimeout(pressTimer); card.style.transitionDuration = '200ms'; if (!state.selectedIds.includes(p.id)) { card.style.boxShadow = 'none'; card.style.borderColor = 'rgba(0,0,0,0.05)'; } else { card.style.boxShadow = '0 0 0 2px var(--accent), 0 0 20px var(--accent-glow)'; card.style.borderColor = 'var(--accent)'; } };
        card.onmousedown = startPress; card.onmouseup = cancelPress; card.onmouseleave = cancelPress; card.ontouchstart = startPress; card.ontouchend = cancelPress;
        card.onclick = (e) => { e.stopPropagation(); const idx = state.selectedIds.indexOf(p.id); if (idx > -1) { state.selectedIds.splice(idx, 1); card.style.borderColor = 'rgba(0,0,0,0.05)'; card.style.boxShadow = 'none'; } else if (state.selectedIds.length < 2) { state.selectedIds.push(p.id); card.style.borderColor = 'var(--accent)'; card.style.boxShadow = '0 0 0 2px var(--accent), 0 0 20px var(--accent-glow)'; } if (state.selectedIds.length === 2) mixBtn.classList.add('visible'); else mixBtn.classList.remove('visible'); };
        l1Cards.appendChild(card);
      });

      state.contentWidth = maxX + 50;
      state.contentHeight = maxY + 50;
      const boundary = document.createElement('div'); boundary.style.cssText = `position:absolute; width:${state.contentWidth + 50}px; height:${state.contentHeight + 50}px; left:-50px; top:-50px; border:2px solid rgba(0,0,0,0.05); border-radius:60px; pointer-events:none;`;
      l1Cards.appendChild(boundary);
    }

    function renderL2(products) {
      l2Grid.innerHTML = ''; l2Grid.className = 'flex gap-[4px] px-[5px]'; 
      const col1 = document.createElement('div'), col2 = document.createElement('div'); 
      col1.className = 'flex flex-col gap-5'; col1.style.width = '194px';
      col2.className = 'flex flex-col gap-5'; col2.style.width = '194px';
      l2Grid.appendChild(col1); l2Grid.appendChild(col2);

      products.forEach((p, i) => {
        const item = document.createElement('div'); item.className = 'flex flex-col cursor-pointer group'; item.setAttribute('data-id', p.id);
        const isLeft = i % 2 === 0, rowIdx = Math.floor(i / 2);
        let h; if (isLeft) { h = (rowIdx % 2 === 0) ? 280 : 194; } else { h = (rowIdx % 2 === 0) ? 194 : 280; }
        
        const brands = ['Nike', 'Adidas', 'Zara', 'Gucci', 'Prada'];
        const brand = brands[p.id % brands.length];
        const reviews = (Math.random() * 5).toFixed(1) + 'k';

        item.innerHTML = `
          <div style="height:${h}px; width:194px; position:relative;" class="rounded-[40px] overflow-hidden border border-black/5 shadow-sm transition-transform group-hover:scale-[1.01]">
            <img src="${p.img}" class="w-full h-full object-cover">
            <div style="position:absolute; left: 72px; bottom:0; height: 30px; display: flex; align-items: flex-end; gap: 4px;">
               <div style="margin-bottom: 10px;"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><circle cx="5.5" cy="5.5" r="5.5" fill="#636363"/></svg></div>
               <div style="margin-bottom: 12.5px; display: flex; gap: 4px;">
                 <svg width="6" height="6" viewBox="0 0 6 6" fill="none"><circle cx="3" cy="3" r="3" fill="#D9D9D9"/></svg>
                 <svg width="6" height="6" viewBox="0 0 6 6" fill="none"><circle cx="3" cy="3" r="3" fill="#D9D9D9"/></svg>
                 <svg width="6" height="6" viewBox="0 0 6 6" fill="none"><circle cx="3" cy="3" r="3" fill="#D9D9D9"/></svg>
                 <svg width="6" height="6" viewBox="0 0 6 6" fill="none"><circle cx="3" cy="3" r="3" fill="#D9D9D9"/></svg>
               </div>
            </div>
          </div>
          <div style="margin-top: 10px; padding-left: 9px;" class="flex flex-col">
            <div style="overflow: hidden; color: #000; text-overflow: ellipsis; white-space: nowrap; font-family: 'Google Sans', sans-serif; font-size: 14px; font-weight: 500; line-height: 20px;">${p.name}</div>
            <div style="margin-top: 4px; display: flex; align-items: center; gap: 4px;">
              <span style="color: #000; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 400; line-height: 17px;">$${p.price}</span>
              <span style="color: rgba(0, 0, 0, 0.55); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 400; line-height: 17px;">·</span>
              <span style="overflow: hidden; color: rgba(0, 0, 0, 0.55); text-overflow: ellipsis; white-space: nowrap; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 400; line-height: 17px;">${brand}</span>
            </div>
            <div style="margin-top: 4px; display: flex; align-items: center; gap: 4px;">
              <span style="color: #000; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 400; line-height: 17px;">${p.rating}</span>
              <span class="material-symbols-outlined" style="color: #000; font-size: 18px; font-weight: 350; line-height: 1;">star</span>
              <span style="color: rgba(0, 0, 0, 0.55); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 400; line-height: 17px;">(${reviews})</span>
            </div>
          </div>
        `;
        item.onclick = () => showL3(p);
        if (isLeft) col1.appendChild(item); else col2.appendChild(item);
      });
    }

    function renderL3(product) {
      l3Carousel.innerHTML = ''; state.products.forEach(p => {
        const item = document.createElement('div'); item.className = 'w-full h-full flex-shrink-0 flex flex-col items-center justify-center p-8 scroll-snap-align-start'; item.style.scrollSnapAlign = 'start'; item.setAttribute('data-id', p.id);
        item.innerHTML = `<div class="w-full h-3/5 rounded-[48px] shadow-2xl mb-10 overflow-hidden"><img src="${p.img}" class="w-full h-full object-cover"></div><div class="text-left w-full px-4"><h1 class="text-4xl font-black mb-2 tracking-tighter text-black">${p.name}</h1><div class="text-blue-400 text-3xl font-black mb-6">$${p.price}</div><div class="flex items-center gap-3 mb-8"><span class="bg-blue-400/20 text-blue-400 px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest">★ ${p.rating}</span></div><p class="text-black/50 text-lg leading-relaxed font-semibold">Flagship sequence discovery.</p></div>`;
        l3Carousel.appendChild(item);
      });
      l3Layer.scrollLeft = state.products.findIndex(p => p.id === product.id) * l3Layer.offsetWidth;
    }

    function triggerSimilarityWave(centerProduct) {
      const threshold = 750; state.products.forEach((p, idx) => {
        const dx = (p.x + p.w/2) - (centerProduct.x + centerProduct.w/2), dy = (p.y + p.h/2) - (centerProduct.y + centerProduct.h/2), dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > 0 && dist < threshold) {
          const cards = Array.from(l1Cards.querySelectorAll('.product-card-l1')), card = cards[idx];
          if (card) {
            const img = card.querySelector('img'); img.style.filter = 'brightness(3) blur(20px)';
            const freshSeed = Date.now() + Math.random(), safeName = encodeURIComponent(centerProduct.name.split('#')[0].trim()), newImgUrl = `https://picsum.photos/seed/${freshSeed}/1200/1200`;
            const preload = new Image(); preload.onload = () => { p.img = newImgUrl; img.src = newImgUrl; img.style.filter = 'brightness(1) blur(0)'; }; preload.src = newImgUrl;
          }
        }
      });
    }

    function updateTransform() {
      const sw = 402, sh = 932, cw = state.contentWidth, ch = state.contentHeight, m = 0;
      state.panX = Math.min(m, Math.max(state.panX, sw - (cw * state.zoom) - m)); state.panY = Math.min(m, Math.max(state.panY, sh - (ch * state.zoom) - m));
      l1Layer.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;

      // Expansion triggers visibility
      if (state.activeLayer === 'L1' && !state.isTransitioning) {
        const threshold = 80;
        const nearBottom = state.panY < sh - (ch * state.zoom) + threshold;
        expandBottom.classList.toggle('visible', nearBottom);
      } else {
        expandBottom.classList.remove('visible');
      }
    }

    let startX, startY; l1Layer.onmousedown = (e) => { if (state.activeLayer !== 'L1') return; state.isPanning = true; startX = e.clientX - state.panX; startY = e.clientY - state.panY; };
    window.onmousemove = (e) => { if (!state.isPanning) return; state.panX = e.clientX - startX; state.panY = e.clientY - startY; requestAnimationFrame(updateTransform); };
    window.onmouseup = () => state.isPanning = false;

    l1Layer.onwheel = (e) => {
      if (state.activeLayer !== 'L1') return; e.preventDefault();
      const rect = document.querySelector('.phone-screen').getBoundingClientRect(), scale = rect.width / 402, mx = (e.clientX - rect.left) / scale, my = (e.clientY - rect.top) / scale;
      if (e.ctrlKey) {
        const oz = state.zoom; 
        // 0.36 is now the MINIMUM zoom (no more bird eye view)
        // 3.0 is the MAXIMUM zoom (see closely)
        state.zoom = Math.max(0.36, Math.min(3.0, state.zoom - e.deltaY * 0.005));
        state.panX = mx - (mx - state.panX) * (state.zoom / oz); state.panY = my - (my - state.panY) * (state.zoom / oz);
        
        // Trigger L2 when user "leans in" beyond 0.8
        if (state.zoom >= 0.8 && !state.isTransitioning) {
          const wx = (mx - state.panX) / state.zoom, wy = (my - state.panY) / state.zoom;
          showL2(state.products.find(p => wx >= p.x && wx <= p.x + p.w && wy >= p.y && wy <= p.y + p.h));
        }
      } else { state.panX -= e.deltaX / scale; state.panY -= e.deltaY / scale; }
      requestAnimationFrame(updateTransform);
    };

    l2Layer.onwheel = (e) => {
      if (state.activeLayer !== 'L2') return;
      if (e.ctrlKey) {
        e.preventDefault(); if (e.deltaY > 0) hideL2();
        else if (e.deltaY < 0) {
          const rect = l2Layer.getBoundingClientRect(), scale = rect.width / 402, mx = (e.clientX - rect.left) / scale, my = (e.clientY - rect.top) / scale + l2Layer.scrollTop;
          const focused = Array.from(l2Grid.querySelectorAll('[data-id]')).find(item => { const r = item.getBoundingClientRect(); const ry = (r.top - rect.top) / scale + l2Layer.scrollTop, rx = (r.left - rect.left) / scale; return mx >= rx && mx <= rx + (r.width / scale) && my >= ry && my <= ry + (r.height / scale); });
          showL3(state.products.find(p => p.id === (focused ? parseInt(focused.getAttribute('data-id')) : 0)));
        }
      }
    };
    l3Layer.onwheel = (e) => { if (state.activeLayer !== 'L3') return; if (e.ctrlKey && e.deltaY > 0) { e.preventDefault(); hideL3(); } };

    function showL2(product = null) {
      if (state.isTransitioning) return; state.isTransitioning = true; state.activeLayer = 'L2';
      renderL2(state.products); l2Layer.style.scrollBehavior = 'auto';
      if (product) { const target = l2Grid.querySelector(`[data-id="${product.id}"]`); if (target) l2Layer.scrollTop = (target.offsetTop + target.parentElement.offsetTop) - 100; } else l2Layer.scrollTop = 0;
      l2Layer.classList.add('active'); l1Layer.style.opacity = '0';
      setTimeout(() => { state.isTransitioning = false; l2Layer.style.scrollBehavior = 'smooth'; }, 800);
    }
    function hideL2() { if (state.isTransitioning) return; state.isTransitioning = true; state.activeLayer = 'L1'; state.zoom = 0.5; l2Layer.classList.remove('active'); l1Layer.style.opacity = '1'; setTimeout(() => { state.isTransitioning = false; updateTransform(); }, 800); }
    function showL3(product) { if (state.isTransitioning) return; state.isTransitioning = true; state.activeLayer = 'L3'; renderL3(product); l3Layer.classList.add('active'); setTimeout(() => state.isTransitioning = false, 600); }
    function hideL3() { if (state.isTransitioning) return; state.isTransitioning = true; state.activeLayer = 'L2'; l3Layer.classList.remove('active'); setTimeout(() => state.isTransitioning = false, 600); }

    function centerCamera() {
      // Force extreme values so updateTransform centers it
      state.panX = -99999;
      state.panY = -99999;
    }

    function showL1() {
      if (state.isTransitioning) return; state.isTransitioning = true;
      
      // Phase 1: Fade out L0 and show Loading
      l0Layer.classList.remove('active');
      loadingLayer.classList.add('active');
      announcer.textContent = 'Searching...';

      setTimeout(() => {
        // Phase 2: Reveal Results (L1)
        state.gridCols = 30; state.gridRows = 50;
        state.products = generateProducts(searchInput.value || 'Vision', 400);
        renderL1();
        state.zoom = 0.36;
        centerCamera();
        updateTransform();
        
        loadingLayer.classList.remove('active');
        l1Layer.classList.add('active');
        l1Layer.style.opacity = '1';
        state.activeLayer = 'L1';
        announcer.textContent = 'Showing results for ' + (searchInput.value || 'Vision');
        
        setTimeout(() => { state.isTransitioning = false; }, 800);
      }, 2000); // 2 second intentional delay
    }

    searchBtn.onclick = () => {
      if (state.activeLayer === 'L0') showL1();
      else {
        state.gridCols = 30; state.gridRows = 50;
        state.products = generateProducts(searchInput.value || 'Vision', 400);
        renderL1();
        state.zoom = 0.36;
        centerCamera();
        updateTransform();
      }
    };
  </script>
</body>
</html>
